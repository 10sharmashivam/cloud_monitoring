steps:
  # Run tests
  - name: 'python:3.9'
    entrypoint: pip
    args: ['install', '-r', 'requirements.txt', 'pytest', 'pytest-cov']
  
  - name: 'python:3.9'
    entrypoint: pytest
    args: ['--cov=./', '--cov-report=xml']

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cloud-monitoring:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cloud-monitoring:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cloud-monitoring'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cloud-monitoring:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/cloud-monitoring:$COMMIT_SHA' 