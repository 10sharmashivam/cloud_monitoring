apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  namespace: istio-system
spec:
  profile: default
  components:
    pilot:
      k8s:
        resources:
          requests:
            cpu: 500m
            memory: 2048Mi
    ingressGateways:
    - name: istio-ingressgateway
      enabled: true
      k8s:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: cloud-monitoring-vs
spec:
  hosts:
  - "cloud-monitoring.local"
  gateways:
  - cloud-monitoring-gateway
  http:
  - match:
    - uri:
        prefix: /api
    route:
    - destination:
        host: cloud-monitoring-service
        port:
          number: 5000
    - match:
    - uri:
        prefix: /metrics
    route:
    - destination:
        host: cloud-monitoring-service
        port:
          number: 8000
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: cloud-monitoring-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "cloud-monitoring.local"
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: cloud-monitoring-auth
spec:
  selector:
    matchLabels:
      app: cloud-monitoring
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/cloud-monitoring"]
    to:
    - operation:
        methods: ["GET"]
        paths: ["/metrics"]
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: cloud-monitoring-dr
spec:
  host: cloud-monitoring-service
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 1024
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 10 